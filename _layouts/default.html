<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">
        Magic <span class="tagline">devlog</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Intro</a>
        <a href="{{ '/project/' | relative_url }}"{% if page.url contains '/project/' %} aria-current="page"{% endif %}>Project</a>
        <a href="{{ '/devlog/' | relative_url }}"{% if page.url contains '/devlog/' or page.url contains '/entries/' %} aria-current="page"{% endif %}>Devlog</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about/' %} aria-current="page"{% endif %}>About Me</a>
        <a href="{{ '/contact/' | relative_url }}"{% if page.url contains '/contact/' %} aria-current="page"{% endif %}>Contact</a>
        <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </nav>
    </div>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>{{ site.description }}</span>
      <span><a href="https://github.com/Kaliffen/magic-devlog">source</a></span>
    </div>
  </footer>
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
