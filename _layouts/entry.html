---
layout: default
---
<article class="entry">
  <header class="entry-header">
    {% if page.tag %}<span class="tag">{{ page.tag }}</span>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.date %}<time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% endif %}
  </header>
  {{ content }}
</article>
