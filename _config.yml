title: Magic Devlog
description: Development log for Magic — a standalone log; source code is private.
url: "https://kaliffen.github.io"
baseurl: "/magic-devlog"

markdown: kramdown
future: true

defaults:
  - scope:
      path: ""
      type: entries
    values:
      layout: entry

collections:
  entries:
    output: true
    permalink: /entries/:title/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
